services:
  redis:
    image: redis:7-alpine
    # Do not publish 6379 on the host — a local Redis is already bound there.
    # api and worker reach this instance on the Compose network as redis:6379.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      OPENAI_MODEL: ${OPENAI_MODEL:-openai/gpt-oss-20b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 8

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: arq app.worker.WorkerSettings
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      OPENAI_MODEL: ${OPENAI_MODEL:-openai/gpt-oss-20b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
